<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basecamp PTN 2027 – Semua Link Kami</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#0b2347;--navy2:#17407c;--card:#fff;--ink:#0f274d;--muted:#64748b;--line:#e6ebf3;--gold:#f5b82e;--soft:#cbd6e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#07172f;--navy2:#0f2c58}}
:root[data-theme="dark"]{--navy:#07172f;--navy2:#0f2c58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;
 -webkit-font-smoothing:antialiased;overflow-x:hidden;
 background:radial-gradient(800px 460px at 90% -8%,rgba(245,184,46,.16),transparent 60%),
  radial-gradient(700px 520px at -10% 35%,rgba(96,150,255,.18),transparent 60%),
  linear-gradient(175deg,var(--navy2),var(--navy) 70%);background-attachment:fixed}
img{display:block;max-width:100%}
.bi{width:1em;height:1em;fill:currentColor;display:block}
h1,h2{margin:0}

/* splash */
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;
 background:radial-gradient(circle at 50% 38%,var(--navy2),var(--navy));transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.sp{display:grid;justify-items:center;gap:10px}
.logo{position:relative;width:128px;height:128px;margin-bottom:10px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.logo:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:rgba(245,184,46,.35);animation:spin 1.6s linear infinite}
.sp h2{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:.14em}
.sp p{margin:0;color:var(--soft);font-weight:500}
.bar{width:min(220px,70vw);height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff);border-radius:99px;animation:load 2.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{to{width:100%}}@keyframes spin{to{transform:rotate(360deg)}}

/* layout */
main{max-width:560px;margin:0 auto;padding:44px 20px 40px}
.hero{text-align:center}
.avatar{position:relative;width:132px;height:132px;margin:0 auto 22px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff;box-shadow:0 18px 44px rgba(0,0,0,.4)}
.avatar:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(245,184,46,.85)}
.avatar:after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
h1{font-size:clamp(30px,8.4vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.025em}
h1 span{color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.tags span{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
 font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--soft)}

.quote{display:flex;gap:14px;margin:30px 0 34px;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left}
.quote .bi{flex:none;font-size:30px;color:var(--gold);margin-top:-2px}
.quote p{margin:0;font-size:15.5px;font-weight:500;color:#e8eefb}
.quote b{color:var(--gold);font-weight:700}

.head{margin-bottom:16px}
.eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.sub{margin:4px 0 0;color:var(--soft);font-size:14.5px}

.links{display:grid;gap:12px}
.btn{display:flex;align-items:center;gap:16px;padding:14px 16px 14px 14px;text-decoration:none;color:var(--ink);background:var(--card);
 border-radius:16px;box-shadow:0 1px 2px rgba(7,23,47,.12),0 10px 24px rgba(7,23,47,.22);
 transition:transform .2s,box-shadow .2s;opacity:0;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);box-shadow:0 2px 4px rgba(7,23,47,.12),0 18px 34px rgba(7,23,47,.32);outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px var(--gold),0 18px 34px rgba(7,23,47,.32)}
.btn:active{transform:translateY(0)}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:27px;color:#fff;
 box-shadow:0 6px 14px rgba(7,23,47,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.txt{flex:1;min-width:0}
.kick{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy2);margin-bottom:2px}
.txt b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.txt small{display:block;margin-top:2px;font-size:13.5px;color:var(--muted);line-height:1.35}
.go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--ink);background:#f1f4fa;transition:background .2s,color .2s,transform .2s}
.btn:hover .go{background:var(--gold);transform:translateX(2px)}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

footer{margin-top:36px;text-align:center;font-size:13px;color:#9fb0cc}
footer b{color:var(--soft);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

<div id="splash" role="button" aria-label="Lewati">
  <div class="sp">
    <div class="logo"><img class="miaw" src="assets/miaw.png" alt="Miaw"></div>
    <h2>WELCOME</h2>
    <p>Mimpi kita berharga.</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<main>
  <header class="hero">
    <div class="avatar"><img class="miaw" src="assets/miaw.png" alt="Miaw"></div>
    <h1>Basecamp <span>PTN 2027</span></h1>
    <div class="tags"><span>Terbentur</span><span>Terbentuk</span><span>Terbebas</span></div>
  </header>

  <div class="quote">
    <svg class="bi"><use href="#i-quote"/></svg>
    <p>Jangan cuma fokus di <b>goal</b> — bangun juga <b>system</b>-nya, biar belajar jadi konsisten.</p>
  </div>

  <div class="head">
    <span class="eyebrow">Temukan Kami</span>
    <h2>5 Tempat Buat Belajar Bareng Kami</h2>
    <p class="sub">Pilih salah satu dan langsung bergabung.</p>
  </div>
  <nav class="links" id="links"></nav>

  <footer>© 2026 <b>Basecamp PTN 2027</b></footer>
</main>

<script>
// GANTI LINK (url) di sini. Foto: taruh file di assets/miaw.png
const LINKS=[
  {kick:"Daftar",name:"ALT 4.0 Batch 2!",desc:"Pakai kode 'ALT-WINPTN' buat promo khusus",icon:"assets/logo.png",color:"#010101",url:"https://https://www.alternatifa.com/"},
  {kick:"Ikuti",name:"Instagram",desc:"Info & tips belajar harian",icon:"instagram",color:`radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)`,url:"https://instagram.com/jooystudy"},
  {kick:"Tonton",name:"TikTok",desc:"Konten belajar singkat",icon:"tiktok",color:"#010101",url:"https://tiktok.com/@jooystudy"},
  {kick:"Update",name:"X (Twitter)",desc:"Thread tips SNBT & info PTN",icon:"x",color:"#0f1419",url:"https://x.com/jooystudy"},
  {kick:"Gabung",name:"Komunitas Discord",desc:"Diskusi & ngambis bareng",icon:"discord",color:"#5865F2",url:"https://discord.gg/AQmZUkkrX"},
  {kick:"Pengumuman",name:"Channel WhatsApp",desc:"Pengumuman & materi baru",icon:"whatsapp",color:"#25D366",url:"https://whatsapp.com/channel/0029VbEQwCWJf05XX0qbnA2f"}
];
const box=document.getElementById('links');
LINKS.forEach((l,i)=>{
  const a=document.createElement('a');
  a.className='btn';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';
  a.style.animationDelay=(2.2+i*.09)+'s';
  a.innerHTML=`<span class="ic" style="background:${l.color}"><svg class="bi"><use href="#i-${l.icon}"/></svg></span><span class="txt"><span class="kick">${l.kick}</span><b>${l.name}</b><small>${l.desc}</small></span><span class="go"><svg class="bi"><use href="#i-chev"/></svg></span>`;
  box.appendChild(a);
});
// cadangan bila assets/miaw.png belum ada
const FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8eefb"/><text x="50" y="64" font-size="46" text-anchor="middle">🐱</text></svg>');
document.querySelectorAll('img.miaw').forEach(im=>im.addEventListener('error',()=>{im.src=FB},{once:true}));
const s=document.getElementById('splash');
const close=()=>{s.classList.add('hide');setTimeout(()=>s.remove(),700)};
setTimeout(close,2300);s.addEventListener('click',close);
</script>
