<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Basecamp PTN 2027 – Semua Link Kami</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --navy: #0b2347;
        --navy2: #17407c;
        --card: #fff;
        --ink: #0f274d;
        --muted: #64748b;
        --line: #e6ebf3;
        --gold: #f5b82e;
        --soft: #cbd6e8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --navy: #07172f;
          --navy2: #0f2c58;
        }
      }
      :root[data-theme="dark"] {
        --navy: #07172f;
        --navy2: #0f2c58;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: #fff;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        background:
          radial-gradient(
            800px 460px at 90% -8%,
            rgba(245, 184, 46, 0.16),
            transparent 60%
          ),
          radial-gradient(
            700px 520px at -10% 35%,
            rgba(96, 150, 255, 0.18),
            transparent 60%
          ),
          linear-gradient(175deg, var(--navy2), var(--navy) 70%);
        background-attachment: fixed;
      }
      img {
        display: block;
        max-width: 100%;
      }
      .bi {
        width: 1em;
        height: 1em;
        fill: currentColor;
        display: block;
      }
      h1,
      h2 {
        margin: 0;
      }

      /* splash */
      #splash {
        --S: min(270px, 78vw, 38vh);
        --dur: 5000ms;
        position: fixed;
        inset: 0;
        z-index: 99;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        cursor: pointer;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 38%,
          var(--navy2),
          var(--navy)
        );
        transition:
          opacity 0.7s,
          transform 0.7s;
      }
      #splash.hide {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          520px 520px at 50% 40%,
          rgba(245, 184, 46, 0.16),
          transparent 65%
        );
        animation: breathe 4s ease-in-out infinite;
      }
      .sp {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 8px;
      }
      .stage {
        position: relative;
        width: var(--S);
        height: var(--S);
        margin-bottom: 26px;
      }
      .orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.16);
        animation: spin 36s linear infinite;
      }
      .ring2 {
        position: absolute;
        inset: 22%;
        border-radius: 50%;
        border: 1px dashed rgba(245, 184, 46, 0.45);
        animation: spin 28s linear infinite reverse;
      }
      .node {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        transform: rotate(var(--a)) translateY(calc(var(--S) / -2))
          rotate(calc(var(--a) * -1));
      }
      .chipwrap {
        width: 100%;
        height: 100%;
        animation: chipIn 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.35) both;
        animation-delay: var(--d);
      }
      .chip {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 19px;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.26);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        animation: unspin 36s linear infinite;
      }
      .chip.gold {
        color: var(--gold);
        background: rgba(245, 184, 46, 0.13);
        border-color: rgba(245, 184, 46, 0.55);
      }
      .logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        animation: logoIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .logo img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        border: 3px solid #fff;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
      }
      .logo:before {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--gold);
        border-right-color: rgba(245, 184, 46, 0.35);
        animation: spin 1.6s linear infinite;
      }
      .sp h2 {
        font-size: clamp(20px, 5.5vw, 26px);
        font-weight: 800;
        letter-spacing: 0.14em;
        animation: rise 0.8s 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sp p {
        margin: 0;
        font-size: 14px;
        color: var(--soft);
        font-weight: 500;
        animation: rise 0.8s 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .bar {
        width: min(180px, 60vw);
        height: 4px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
        margin-top: 12px;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--gold), #fff);
        border-radius: 99px;
        animation: load var(--dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .skip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        z-index: 1;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: rgba(203, 214, 232, 0.7);
        animation: rise 0.8s 2s ease both;
      }
      @keyframes load {
        to {
          width: 100%;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes unspin {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes chipIn {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes logoIn {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      /* layout */
      main {
        max-width: 440px;
        margin: 0 auto;
        padding: 32px 18px 28px;
      }
      .hero {
        text-align: center;
      }
      .avatar {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 18px;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        border: 3px solid #fff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
      }
      .avatar:before {
        content: "";
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 1.5px solid rgba(245, 184, 46, 0.85);
      }
      .avatar:after {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      h1 {
        font-size: clamp(24px, 6.6vw, 30px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: var(--gold);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-top: 12px;
      }
      .tags span {
        padding: 4px 11px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--soft);
      }

      .quote {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 24px;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-align: left;
      }
      .quote .bi {
        flex: none;
        font-size: 24px;
        color: var(--gold);
      }
      .quote p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #e8eefb;
      }
      .quote b {
        color: var(--gold);
        font-weight: 700;
      }

      .head {
        margin-bottom: 12px;
      }
      .eyebrow {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 4px;
      }
      h2 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--soft);
        font-size: 13px;
      }

      .links {
        display: grid;
        gap: 9px;
      }
      .btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px 10px 10px;
        text-decoration: none;
        color: var(--ink);
        background: var(--card);
        border-radius: 14px;
        box-shadow:
          0 1px 2px rgba(7, 23, 47, 0.12),
          0 6px 16px rgba(7, 23, 47, 0.2);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      body:not(.ready) .btn {
        opacity: 0;
      }
      body.ready .btn {
        animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      .btn:hover,
      .btn:focus-visible {
        transform: translateY(-2px);
        box-shadow:
          0 2px 4px rgba(7, 23, 47, 0.12),
          0 12px 26px rgba(7, 23, 47, 0.3);
        outline: none;
      }
      .btn:focus-visible {
        box-shadow:
          0 0 0 3px var(--gold),
          0 12px 26px rgba(7, 23, 47, 0.3);
      }
      .btn:active {
        transform: translateY(0);
      }
      .ic {
        flex: none;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 22px;
        color: #fff;
        box-shadow: 0 4px 10px rgba(7, 23, 47, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .txt {
        flex: 1;
        min-width: 0;
      }
      .kick {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--navy2);
        margin-bottom: 1px;
      }
      .txt b {
        display: block;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .txt small {
        display: block;
        margin-top: 1px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }
      .go {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--ink);
        background: #f1f4fa;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
      }
      .btn:hover .go {
        background: var(--gold);
        transform: translateX(2px);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      footer {
        margin-top: 26px;
        text-align: center;
        font-size: 12px;
        color: #9fb0cc;
      }
      footer b {
        color: var(--soft);
        font-weight: 600;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
        }
        .orbit,
        .ring2,
        .chip,
        .logo:before,
        #splash::before {
          animation: none !important;
        }
      }
    </style>
  </head>

    <script>
      // GANTI LINK (url) di sini. Foto: taruh file di assets/
      const LINKS = [
        {
          kick: "Daftar",
          name: "ALT 4.0 Batch 2!",
          desc: "Pakai kode 'ALT-WINPTN' buat promo khusus",
          img: "assets/alter.png",
          color: "transparent",
          url: "https://www.alternatifa.com/",
        },
        {
          kick: "Ikuti",
          name: "Instagram",
          desc: "Info & tips belajar harian",
          icon: "instagram",
          color: `radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)`,
          url: "https://instagram.com/jooystudy",
        },
        {
          kick: "Tonton",
          name: "TikTok",
          desc: "Konten belajar singkat",
          icon: "tiktok",
          color: "#010101",
          url: "https://tiktok.com/@jooystudy",
        },
        {
          kick: "Update",
          name: "X (Twitter)",
          desc: "Thread tips SNBT & info PTN",
          icon: "x",
          color: "#0f1419",
          url: "https://x.com/jooystudy",
        },
        {
          kick: "Gabung",
          name: "Komunitas Discord",
          desc: "Diskusi & ngambis bareng",
          icon: "discord",
          color: "#5865F2",
          url: "https://discord.gg/AQmZUkkrX",
        },
        {
          kick: "Pengumuman",
          name: "Channel WhatsApp",
          desc: "Pengumuman & materi baru",
          icon: "whatsapp",
          color: "#25D366",
          url: "https://whatsapp.com/channel/0029VbEQwCWJf05XX0qbnA2f",
        },
      ];

      const box = document.getElementById("links");

      LINKS.forEach((l, i) => {
        const a = document.createElement("a");
        a.className = "btn";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.style.animationDelay = i * 0.09 + "s";

        // Cek apakah item memakai gambar (img) atau ikon SVG (icon)
        const mediaContent = l.img
          ? `<img src="${l.img}" alt="${l.name}" style="width:100%; height:100%; object-fit:cover; border-radius:9px;">`
          : `<svg class="bi"><use href="#i-${l.icon}"/></svg>`;

        a.innerHTML = `<span class="ic" style="background:${l.color}; padding:${l.img ? "3px" : "0"}">${mediaContent}</span><span class="txt"><span class="kick">${l.kick}</span><b>${l.name}</b><small>${l.desc}</small></span><span class="go"><svg class="bi"><use href="#i-chev"/></svg></span>`;

        box.appendChild(a);
      });

      // Cadangan bila assets/miaww.png belum ada
      const FB =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8eefb"/><text x="50" y="64" font-size="46" text-anchor="middle">🐱</text></svg>',
        );

      document.querySelectorAll("img.miaw").forEach((im) =>
        im.addEventListener(
          "error",
          () => {
            im.src = FB;
          },
          { once: true },
        ),
      );

      const SPLASH_MS = 5000; // durasi splash (ms), ubah di sini
      const s = document.getElementById("splash");
      s.style.setProperty("--dur", SPLASH_MS + "ms");
      const close = () => {
        if (s.classList.contains("hide")) return;
        s.classList.add("hide");
        document.body.classList.add("ready");
        setTimeout(() => s.remove(), 700);
      };
      setTimeout(close, SPLASH_MS);
      s.addEventListener("click", close);
    </script>
